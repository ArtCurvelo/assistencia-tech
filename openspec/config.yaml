schema: spec-driven

context: |
  Projeto acadêmico (curso de ADS) de gestão de assistência técnica.
  Todos os artefatos devem ser escritos em português do Brasil; as palavras-chave
  normativas do OpenSpec (SHALL, MUST, WHEN, THEN) permanecem em inglês.
  Frontend em Python com Reflex 0.8.x; backend e banco de dados planejados no Xano.
  Regra absoluta: nunca inventar endpoints, métodos HTTP, contratos de autenticação,
  estruturas de resposta ou campos da API do Xano. Enquanto a documentação oficial
  não for fornecida, usar apenas interfaces internas, mocks e o modo demonstração,
  sempre identificado como tal na interface.
  Ambiente de desenvolvimento: Windows, PowerShell e .venv local.
  Cada arquivo Python deve ter menos de 1000 linhas.

rules:
  tasks:
    - Cada tarefa deve indicar como sua conclusão será verificada.
    - Tarefas que dependem dos contratos do Xano devem ser marcadas como bloqueadas.
  proposal:
    - Declarar explicitamente o que está fora do escopo.
