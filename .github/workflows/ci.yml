# Integração contínua do Assistência TECH (mudança add-continuous-integration).
# Roda sem segredos: modo demonstração, servidores simulados e as cópias da
# documentação do Xano em docs/xano-openapi/. Nada aqui acessa o Xano real.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSISTENCIA_DATA_SOURCE: demo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes automatizados com cobertura
        run: python -m pytest --cov=assistencia_tech --cov-report=term-missing:skip-covered

      - name: Contrato com o Xano (cópias da documentação)
        run: python -m tools.xano_contract_check --offline

      - name: Montagem de todas as páginas do Reflex
        run: python -c "import assistencia_tech.assistencia_tech as app; print(len(app.app._unevaluated_pages), 'páginas')"

  especificacoes:
    name: Especificações OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validação estrita das especificações
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
