# Mantém o site publicado acordado no plano gratuito do Render, que dorme após
# 15 minutos sem acesso. Só chama o endereço público /ping: sem segredos.
# O agendamento do GitHub é aproximado (pode atrasar alguns minutos).
name: Manter o site acordado

on:
  schedule:
    # A cada 10 minutos, de segunda a sexta, das 8h às 23h de Brasília (11h–02h UTC).
    - cron: "*/10 11-23 * * 1-5"
    - cron: "*/10 0-1 * * 2-6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Acessar o site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /ping (até 3 tentativas; a primeira pode acordar o site)
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://assistencia-tech-2eyb.onrender.com/ping || true)
            echo "tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "O site não respondeu." >&2
          exit 1
