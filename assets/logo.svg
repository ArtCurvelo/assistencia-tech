<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="titulo">
  <title id="titulo">Assistência TECH</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dff78"/>
      <stop offset="1" stop-color="#20c940"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado na cor da marca -->
  <rect width="64" height="64" rx="16" fill="url(#fundo)"/>
  <!-- Engrenagem: dentes (traço tracejado) e anel -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#031008" stroke-width="6"
          stroke-dasharray="8.25 8.24" transform="rotate(-11 32 32)"/>
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#031008" stroke-width="4.5"/>
  <!-- Raio: tecnologia e conserto rápido -->
  <path d="M35 17.5 L23.5 34 H31 L28.5 46.5 L40.5 29.5 H33 L36.5 17.5 Z" fill="#031008"/>
</svg>
